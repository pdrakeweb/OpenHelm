name: Release

# Cutting a release is pushing a tag: `git tag v1.2.3 && git push origin v1.2.3`. This builds both
# APKs against that tag and publishes them on a GitHub Release. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)build and publish, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag being released
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      # A tag with a hyphenated suffix (v1.2.3-beta1) publishes as a GitHub prerelease; a plain
      # vX.Y.Z tag publishes as a full release.
      - name: Classify the tag
        id: classify
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          echo "versionName=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require the release signing secrets
        # The release build type only gets a signingConfig when OPENHELM_STORE_FILE resolves
        # (app/build.gradle.kts) — without it assembleRelease still succeeds but produces an
        # unsigned APK that Android refuses to install. A tagged release must always be signed,
        # so fail fast here with a clear reason instead of publishing something uninstallable.
        if: ${{ secrets.OPENHELM_STORE_BASE64 == '' }}
        run: |
          echo "::error::OPENHELM_STORE_BASE64 is not set. Add it (plus OPENHELM_STORE_PASSWORD, OPENHELM_KEY_ALIAS and OPENHELM_KEY_PASSWORD) as repository secrets before pushing a release tag — see docs/RELEASING.md."
          exit 1

      - name: Decode the release signing key
        run: |
          keystore_path="$RUNNER_TEMP/openhelm-release.jks"
          echo "${{ secrets.OPENHELM_STORE_BASE64 }}" | base64 -d > "$keystore_path"
          echo "OPENHELM_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          OPENHELM_STORE_PASSWORD: ${{ secrets.OPENHELM_STORE_PASSWORD }}
          OPENHELM_KEY_ALIAS: ${{ secrets.OPENHELM_KEY_ALIAS }}
          OPENHELM_KEY_PASSWORD: ${{ secrets.OPENHELM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PopenhelmVersionName="${{ steps.classify.outputs.versionName }}" \
            -PopenhelmVersionCode="${{ steps.classify.outputs.versionCode }}" \
            --no-daemon

      - name: Remove the decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openhelm-release.jks"

      - name: Stage the APKs for the release
        run: |
          version="${{ steps.classify.outputs.versionName }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-artifacts/openhelm-${version}-debug.apk"
          # Signed, the release output is app-release.apk; without a signingConfig AGP names it
          # app-release-unsigned.apk instead. The step above already fails the build in that case,
          # but the glob keeps this step from being the confusing failure if that ever changes.
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          cp "$release_apk" "release-artifacts/openhelm-${version}-release.apk"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OpenHelm ${{ steps.classify.outputs.versionName }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          generate_release_notes: true
          files: release-artifacts/*.apk
